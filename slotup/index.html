<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SlotUp</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>SlotUp</h1>
  
  <!-- ===== CREATOR DASHBOARD (default view) ===== -->
  <div id="creator-dashboard" style="max-width: 500px; margin: 0 auto;">
    <h2>Create New Plan</h2>
    <div style="margin-bottom: 1em;">
      <label>Plan name: <input id="plan-name" placeholder="e.g. Team Vacation 2026" style="width: 300px;"></label>
      <button id="create-plan-btn" style="margin-left: 1em;">Create & Share</button>
    </div>
    <div id="share-section" style="display: none; background: #e8f5e8; padding: 1em; border-radius: 8px;">
      <h3>✅ Plan Created!</h3>
      <p><strong>Share this link with your team:</strong></p>
      <input id="share-url" readonly style="width: 100%; padding: 8px; margin-bottom: 0.5em;">
      <button id="copy-share-url" style="background: #2196f3; color: white;">Copy Link</button>
      <p style="font-size: 0.9em; margin-top: 1em;">
        Everyone who visits this link can mark their availability instantly.
      </p>
    </div>
  </div>

  <!-- ===== PARTICIPANT VIEW (shown when ?plan=ID exists) ===== -->
<!-- ===== PARTICIPANT VIEW (corrected) ===== -->
<div id="participant-view" style="display: none; max-width: 800px; margin: 0 auto;">
  <div style="text-align: center; margin-bottom: 2em;">
    <button id="back-to-creator" style="background: none; border: none; font-size: 1.2em; cursor: pointer;">← Create New Plan</button>
    <h2 id="plan-title">Loading...</h2>
  </div>

  <!-- Summary button + container -->
  <div style="margin-bottom: 2em; text-align: center;">
    <button id="summary-btn" style="background: #2196f3; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">📊 Show Summary</button>
    <div id="summary" style="margin-top: 1em; display: none;"></div>
  </div>

  <!-- Participant section -->
  <div id="participant-section" style="margin-bottom: 1em; text-align: center;">
    <label>Your name: <input id="participant-name" placeholder="Your name" style="width: 250px;"></label>
    <button id="save-btn" style="margin-left: 1em; background: #4caf50; color: white;">Save Availability</button>
  </div>

  <!-- CALENDAR - must be here -->
  <div id="calendar"></div>

  <!-- Status legend -->
  <div id="status-legend" style="margin-top: 1em; text-align: center;">
    <button data-status="available" style="background: #4caf50; color: white; margin-right: 0.5em; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer;">Available</button>
    <button data-status="maybe" style="background: #ff9800; color: white; margin-right: 0.5em; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer;">Maybe</button>
    <button data-status="not-available" style="background: #f44336; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer;">Not Available</button>
  </div>
</div>

<!-- SCRIPTS MUST BE AT END OF BODY -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
